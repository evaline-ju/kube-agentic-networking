{{- if and .Values.telemetryPolicy.enabled .Values.collector.enabled }}
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XTelemetryPolicy
metadata:
  name: {{ .Values.telemetryPolicy.name | default "agentic-net-gateway-tracing" }}
  labels:
    {{- include "observability-example.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.telemetryPolicy.gatewayName | default "agentic-net-gateway" }}
  tracing:
    mode: Enabled
    provider:
      backendRef:
        name: otel-collector
        port: 4317
    {{- if .Values.telemetryPolicy.samplingRate }}
    samplingRate:
      numerator: {{ .Values.telemetryPolicy.samplingRate }}
    {{- end }}
    {{- if .Values.telemetryPolicy.serviceName }}
    serviceName: {{ .Values.telemetryPolicy.serviceName }}
    {{- end }}
    {{- with .Values.telemetryPolicy.attributes }}
    attributes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
